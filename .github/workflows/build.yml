name: CI

on:
  push:
    branches: ["*"]
    tags: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build with the repo's own flake rather than a third-party pdflatex
      # container. CI then uses byte-identical texlive to `nix develop` locally,
      # Renovate manages the toolchain through flake.lock, and the previous
      # `apk add make || apt-get install make` guess about the base image goes
      # away.
      - uses: cachix/install-nix-action@v31.11.1

      - name: Lint
        run: nix develop --command make lint

      # No MAIN_FILE/BUILD_NAME here: the Makefile detects the main file, and
      # the steps below glob build/*.pdf. That is what retires `make sync-ci`.
      - name: Build PDF
        run: nix develop --command make

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: pdf
          path: build/*.pdf
          if-no-files-found: error

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: build/*.pdf
